<div class="max-w-2xl mx-auto p-6 bg-white rounded-lg shadow">
  <h1 class="text-3xl font-bold text-gray-900 mb-6">Bienvenido a Cinepolis</h1>
  <p>Precio por boleto: $12.000</p>
  <form [formGroup]="formulario">
    <div class="mb-5">
        <h1 class="text-blue-700">Entradas</h1>
      <label for="nombre" class="block mb-2 text-sm font-medium text-gray-900"> 
        Nombre
      </label>
 
      <input
        type="text"
        id="nombre"
        name="nombre"
        formControlName="nombre"
        required
        placeholder="nombre"
        class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg
               focus:ring-blue-500 focus:border-blue-500 block w-full p-2.5"><br>
 
      <label for="compradores" class="block mb-2 text-sm font-medium text-gray-900">
        Cantidad de compradores
      </label>
 
      <input
        type="text"
        id="compradores"
        name="compradores"
        formControlName="compradores"
        required
        placeholder="escriba la cantidad de compradores"
        class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg
               focus:ring-blue-500 focus:border-blue-500 block w-full p-2.5"><br>
 
      <label for="tarjepuntos" class="block mb-2 text-sm font-medium text-gray-900">
        Tarjeta Cineco
      </label>
 
      <label for="tarjepuntos" class=" mb-2 text-sm font-semibold text-gray-900">
        SI
      </label>
      <input
        type="radio"
        id="tarjepuntos"
        name="tarjepuntos"
        value="si"
        formControlName="tarjepuntos"
        required
        class="">
        <label for="tarjepuntos" class=" mb-2 text-sm font-semibold text-gray-900">
        NO
      </label>
      <input
        type="radio"
        id="tarjepuntos"
        name="tarjepuntos"
        value="no" 
        formControlName="tarjepuntos"
        required
        class=""><br>
 
        <br><label for="boletos" class="block mb-2 text-sm font-medium text-gray-900">
        Cantidad de boletos
      </label>

      <input
        type="text"
        id="boletos"
        name="boletos"
        formControlName="boletos"
        required
        placeholder="escriba la cantidad de boletos"
        class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg
               focus:ring-blue-500 focus:border-blue-500 block w-full p-2.5">
      <p class="text-sm text-gray-600 mb-4">
        Cada comprador puede adquirir máximo 7 boletos.
      </p>
    <div class="mb-5">
        <h1 class="text-blue-700">Acciones</h1>
      <div class="flex mt-5">
        <button
          type="submit"
          (click)="procesarCompra()"
          class="text-white bg-blue-700 hover:bg-blue-800
                 focus:ring-4 focus:outline-none focus:ring-blue-300
                 font-medium rounded-lg text-sm px-5 py-2.5
                 disabled:opacity-50 disabled:cursor-not-allowed">
                 Procesar
        </button>
        <button
          type="button"
          (click)="salir()"
          class="text-white bg-blue-700 hover:bg-blue-800
                 focus:ring-4 focus:outline-none focus:ring-blue-300
                 font-medium rounded-lg text-sm px-5 py-2.5
                 disabled:opacity-50 disabled:cursor-not-allowed">
          Salir
        </button>
      </div>
    </div>
        <h1 class="text-blue-700">Salidas</h1>
    <div class="mb-5">
      @if (mensaje !== '') {
        <p class="mt-4 text-red-600">{{mensaje}}</p>
        }

    <p class="text-lg font-bold mt-4">Valor a pagar: ${{valorPagar}}</p>
      </div>
    </div>
  </form>
</div>
