<div class="max-w-6xl mx-auto p-6 bg-white rounded-lg shadow">

  <h2 class="mb-4 text-2xl font-bold text-gray-900">
    Registros de Cinepolis
  </h2>

  <div class="relative overflow-x-auto shadow-md sm:rounded-lg">

    <table class="w-full text-sm text-left text-gray-500">

      <thead class="text-xs text-gray-700 uppercase bg-gray-100">
        <tr>
          <th scope="col" class="px-6 py-3">Nombre</th>
          <th scope="col" class="px-6 py-3">Compradores</th>
          <th scope="col" class="px-6 py-3">Tarjeta Cineco</th>
          <th scope="col" class="px-6 py-3">Boletos</th>
          <th scope="col" class="px-6 py-3">Acciones</th>
        </tr>
      </thead>

      <tbody>

        <tr *ngFor="let entrada of entradas; let i = index"
            class="bg-white border-b border-gray-200 hover:bg-gray-50">

          <td class="px-6 py-4 font-medium text-gray-900">
            {{ entrada.nombre }}
          </td>

          <td class="px-6 py-4">
            {{ entrada.compradores }}
          </td>

          <td class="px-6 py-4">
            {{ entrada.tarjepuntos === 'si' ? 'Sí' : 'No' }}
          </td>

          <td class="px-6 py-4">
            {{ entrada.boletos }}
          </td>

          <td class="px-6 py-4">
            <div class="flex gap-2">

              <button
                type="button"
                class="px-4 py-2 text-sm font-medium text-white bg-green-600 rounded-lg hover:bg-green-700"
                (click)="editarEntrada(i)">
                Editar
              </button>

              <button
                type="button"
                class="px-4 py-2 text-sm font-medium text-white bg-red-600 rounded-lg hover:bg-red-700"
                (click)="eliminarEntrada(i)">
                Eliminar
              </button>
            </div>
          </td>
        </tr>
      </tbody>
    </table>
  </div>


  <div class="mt-8 border-t pt-6">

    <h2 class="mb-4 text-xl font-bold text-gray-900">
      Editar registro
    </h2>

    <form [formGroup]="formulario">

      <div class="mb-4">
        <label for="nombre" class="block mb-2 text-sm font-medium text-gray-900">
          Nombre
        </label>

        <input
          type="text"
          id="nombre"
          formControlName="nombre"
          (input)="nuevaEntrada.nombre = formulario.value.nombre"
          class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg block w-full p-2.5">
      </div>

      <div class="mb-4">
        <label for="compradores" class="block mb-2 text-sm font-medium text-gray-900">
          Cantidad de compradores
        </label>

        <input
          type="number"
          id="compradores"
          formControlName="compradores"
          (input)="nuevaEntrada.compradores = formulario.value.compradores"
          class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg block w-full p-2.5">
      </div>

      <div class="mb-4">
        <label class="block mb-2 text-sm font-medium text-gray-900">
          Tarjeta Cineco
        </label>

        <label class="mr-2">
          Sí
          <input
            type="radio"
            formControlName="tarjepuntos"
            value="si"
            (change)="nuevaEntrada.tarjepuntos = 'si'">
        </label>

        <label>
          No
          <input
            type="radio"
            formControlName="tarjepuntos"
            value="no"
            (change)="nuevaEntrada.tarjepuntos = 'no'">
        </label>
      </div>

      <div class="mb-4">
        <label for="boletos" class="block mb-2 text-sm font-medium text-gray-900">
          Cantidad de boletos
        </label>

        <input
          type="number"
          id="boletos"
          formControlName="boletos"
          (input)="nuevaEntrada.boletos = formulario.value.boletos"
          class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg block w-full p-2.5">
      </div>

      <button
        type="button"
        (click)="guardarCambios()"
        class="text-white bg-blue-700 hover:bg-blue-800
                 focus:ring-4 focus:outline-none focus:ring-blue-300
                 font-medium rounded-lg text-sm px-5 py-2.5
                 disabled:opacity-50 disabled:cursor-not-allowed">
        Guardar cambios
      </button>

      <button
        type="button"
        (click)="regresar()"
        class="text-white bg-blue-700 hover:bg-blue-800
                 focus:ring-4 focus:outline-none focus:ring-blue-300
                 font-medium rounded-lg text-sm px-5 py-2.5
                 disabled:opacity-50 disabled:cursor-not-allowed">
        Regresar a Cinepolis
      </button>

    </form>

  </div>

</div>
